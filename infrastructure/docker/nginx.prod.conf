# ==============================================================================
# OpenReview AI - Production Reverse Proxy & TLS 1.3 Termination (NGINX)
# ==============================================================================

# Rate limiting zone: 50 requests per second per IP with 10MB state store
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;
limit_req_status 429;

# Upstream backend cluster
upstream backend_cluster {
    server backend:8000;
    keepalive 32;
}

# 1. HTTP Server - Strict Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.openreview.ai staging-api.openreview.ai localhost;

    # ACME Challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Hardened TLS 1.3 Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.openreview.ai staging-api.openreview.ai localhost;

    # SSL Certificates (managed via Let's Encrypt / Mounted Secrets)
    ssl_certificate /etc/letsencrypt/live/openreview.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openreview.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/openreview.ai/chain.pem;

    # TLS Protocols & Cipher Suites (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Enterprise Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # Request Body Size (supports large PR diffs up to 25MB)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Health Check Endpoint (Bypasses rate limiting for cloud load balancers)
    location /api/v1/health {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (SSE) Live Review Streaming
    location ~* ^/api/v1/reviews/[^/]+/events$ {
        limit_req zone=api_rate_limit burst=20 nodelay;
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time SSE event delivery
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API Endpoints Routing
    location / {
        limit_req zone=api_rate_limit burst=30 nodelay;
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
