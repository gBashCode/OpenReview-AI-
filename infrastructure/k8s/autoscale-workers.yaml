apiVersion: apps/v1
kind: Deployment
metadata:
  name: openreview-worker-fast
  namespace: openreview
  labels:
    app: openreview-worker
    tier: fast
    autoscale: autoscalex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openreview-worker
      tier: fast
  template:
    metadata:
      labels:
        app: openreview-worker
        tier: fast
    spec:
      containers:
        - name: celery-worker-fast
          image: ghcr.io/openreview-ai/worker:latest
          command:
            - celery
            - -A
            - app.core.celery_app.celery_app
            - worker
            - --loglevel=info
            - -Q
            - reviews.fast
            - --concurrency=4
            - -n
            - worker-fast@%h
          envFrom:
            - configMapRef:
                name: openreview-config
            - secretRef:
                name: openreview-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: openreview-worker-fast-scaler
  namespace: openreview
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openreview-worker-fast
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST_PORT
        listName: reviews.fast
        listLength: "2"
---
