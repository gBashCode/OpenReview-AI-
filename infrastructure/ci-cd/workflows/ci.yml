name: CI - Test & Quality Checks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Linting & Test Suite
  # ============================================================================
  backend-test:
    name: Backend Pytest & Type Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: openreview_test
          POSTGRES_USER: openreview_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev git

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install ruff pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check backend tests workers

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://openreview_admin:test_password@localhost:5432/openreview_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-github-actions
          APP_ENV: test
          PYTHONPATH: backend:.
        run: |
          pytest tests -v --durations=10

  # ============================================================================
  # 2. Frontend Lint, Typecheck & Production Build
  # ============================================================================
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Production Vite Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_ENV: production
