name: CD - Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Database Migrations
  # ============================================================================
  migrate-staging-db:
    name: Run Staging Alembic Migrations
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Migration Dependencies
        run: |
          pip install alembic asyncpg sqlalchemy greenlet pydantic-settings

      - name: Run Migrations on Staging Database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PYTHONPATH: backend
        run: |
          alembic -c backend/alembic.ini upgrade head

  # ============================================================================
  # 2. Deploy Backend & Workers to Staging
  # ============================================================================
  deploy-backend-staging:
    name: Deploy Backend & Celery Workers (Staging)
    needs: [migrate-staging-db]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/openreview-staging
            git pull origin main
            docker compose -f docker-compose.prod.yml pull backend worker-reviews worker-indexing worker-autofix worker-publishing
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f

  # ============================================================================
  # 3. Deploy Frontend to Vercel (Staging Preview)
  # ============================================================================
  deploy-frontend-staging:
    name: Deploy React to Vercel Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://staging-api.openreview.ai/api/v1
          VITE_APP_ENV: staging

      - name: Deploy Project to Vercel Preview
        id: vercel-deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT
        working-directory: frontend

  # ============================================================================
  # 4. Verify Actual GitHub PR Review Functionality in Staging
  # ============================================================================
  verify-staging-pr-review:
    name: Verify Live GitHub PR Review in Staging
    needs: [deploy-backend-staging, deploy-frontend-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verification Dependencies
        run: pip install httpx pydantic

      - name: Execute Live Staging E2E Smoke & PR Review Test
        env:
          STAGING_API_URL: https://staging-api.openreview.ai
          TEST_GITHUB_REPO: ${{ secrets.TEST_GITHUB_REPO }}
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
        run: |
          python scripts/verify_staging_deployment.py
