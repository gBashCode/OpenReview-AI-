# ==============================================================================
# OpenReview AI - Production PostgreSQL 16 & pgvector Configuration
# ==============================================================================

# Connectivity & Connections
listen_addresses = '*'
max_connections = 100

# Memory Configuration (Tuned for 4GB-8GB Host Systems)
shared_buffers = 1GB
work_mem = 64MB
maintenance_work_mem = 256MB  # Essential for HNSW vector index construction
effective_cache_size = 3GB

# Checkpointing & Write Ahead Log (WAL)
wal_level = replica
checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Query Planner & Cost Tuning (SSD / NVMe storage)
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging & Telemetry
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 250  # Log queries slower than 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# Locale & Time
timezone = 'UTC'
client_encoding = 'utf8'
