version: '3.8'

# ==============================================================================
# OpenReview AI - Enterprise Production Deployment Compose Specification
# ==============================================================================

services:
  # 1. PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openreview-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openreview}
      POSTGRES_USER: ${POSTGRES_USER:-openreview_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openreview_admin} -d ${POSTGRES_DB:-openreview}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - openreview-backend-net

  # 2. Redis 7 - Celery Broker & Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: openreview-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - openreview-backend-net

  # 3. FastAPI Core API Service
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: openreview-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_FORMAT=json
      - PROMETHEUS_METRICS_ENABLED=true
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - openreview-backend-net

  # 4. Celery Worker - Reviews Queue (Autonomous Multi-Agent Deliberations)
  worker-reviews:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: openreview-worker-reviews
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "-Q", "reviews,default", "--concurrency=4", "-n", "worker_reviews@%h"]
    networks:
      - openreview-backend-net

  # 5. Celery Worker - Indexing Queue (Tree-sitter AST & pgvector Chunks)
  worker-indexing:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: openreview-worker-indexing
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "-Q", "indexing", "--concurrency=2", "-n", "worker_indexing@%h"]
    networks:
      - openreview-backend-net

  # 6. Celery Worker - AutoFix & Ephemeral Sandboxes
  worker-autofix:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: openreview-worker-autofix
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "-Q", "autofix", "--concurrency=2", "-n", "worker_autofix@%h"]
    networks:
      - openreview-backend-net

  # 7. Celery Worker - GitHub Publishing & Status Checks
  worker-publishing:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: openreview-worker-publishing
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "-Q", "publishing,dead_letter", "--concurrency=2", "-n", "worker_publishing@%h"]
    networks:
      - openreview-backend-net

  # 8. Celery Beat - Periodic Job Scheduler
  worker-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: openreview-worker-beat
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info"]
    networks:
      - openreview-backend-net

  # 9. NGINX - Production TLS 1.3 Termination & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: openreview-prod-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    networks:
      - openreview-backend-net

  # 10. Prometheus - Production Metrics & Alerts
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: openreview-prod-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - openreview-backend-net

  # 11. Grafana - Telemetry & Observability Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: openreview-prod-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_secure_password}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - openreview-backend-net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  certs_data:
    driver: local
  certbot_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  openreview-backend-net:
    driver: bridge
